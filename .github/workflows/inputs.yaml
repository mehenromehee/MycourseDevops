name: Node Inputs pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose the environment to run"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production
      port:
        description: "Choose the port in which application runs"
        required: true
        default: "3000"
        type: choice
        options:
          - 3000
          - 5000
jobs:
  node:
    runs-on: wsl-linux

    steps:
      - name: clone code
        uses: actions/checkout@v7

      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install
        
      - name: Create .env file
        run: 
          echo "PORT=8080" >> .env.development
          echo "App=GHA-NODE-DEV-APP" >> .env.development
          echo "PORT=5000" >> .env.production
          echo "App=GHA-NODE-PROD-APP" >> .env.production
          
      - name: Run the application
        run: |
          node apt.js ${{ github.event.inputs.environment }} &
          sleep 5
          curl http://localhost:${{ github.event.inputs.port }}
          curl http://localhost:${{ github.event.inputs.port }}/health
          pkill -f "node apt.js"
